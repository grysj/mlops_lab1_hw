[project]
name = "mlops-lab1-hw"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "clean-text>=0.7.1",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = ["mypy>=2.4.0", "pre-commit>=4.6.2", "pytest>=9.1.1", "ruff>=0.17.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
